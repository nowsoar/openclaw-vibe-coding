<!-- Settings partial — loaded by HTMX into #content -->
<div x-data="settingsSection()" x-init="load()" class="max-w-2xl">

  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Settings</h1>
    <p class="text-sm text-gray-500 mt-1">Loaded from your <code class="bg-gray-100 px-1 rounded">.harness/config.yaml</code></p>
  </div>

  <!-- API Key status -->
  <div class="bg-white rounded-lg border border-gray-200 divide-y divide-gray-100">
    <div class="px-5 py-4">
      <h2 class="font-semibold text-gray-800 mb-3">LLM Configuration</h2>
      <dl class="space-y-2 text-sm">
        <div class="flex justify-between">
          <dt class="text-gray-500">API Key</dt>
          <dd>
            <span :class="cfg.has_api_key ? 'text-green-600' : 'text-red-500'" class="font-medium"
                  x-text="cfg.has_api_key ? '✓ Configured' : '✗ Not set'"></span>
          </dd>
        </div>
        <div class="flex justify-between">
          <dt class="text-gray-500">Default Model</dt>
          <dd class="font-mono text-xs bg-gray-50 px-2 py-0.5 rounded"
              x-text="cfg.model || 'gpt-4o-mini'"></dd>
        </div>
        <div class="flex justify-between">
          <dt class="text-gray-500">Base URL</dt>
          <dd class="font-mono text-xs text-gray-600"
              x-text="cfg.base_url || 'https://api.openai.com/v1'"></dd>
        </div>
      </dl>
    </div>

    <div class="px-5 py-4">
      <h2 class="font-semibold text-gray-800 mb-2">Environment</h2>
      <p class="text-sm text-gray-500">
        Set <code class="bg-gray-100 px-1 rounded">OPENAI_API_KEY</code> or configure
        <code class="bg-gray-100 px-1 rounded">.harness/config.yaml</code> to enable Skill execution.
      </p>
    </div>
  </div>

  <!-- Quick links -->
  <div class="mt-6 bg-white rounded-lg border border-gray-200 px-5 py-4">
    <h2 class="font-semibold text-gray-800 mb-3">Quick Links</h2>
    <div class="flex flex-wrap gap-3 text-sm">
      <a href="/docs" target="_blank"
         class="flex items-center gap-1 text-indigo-600 hover:underline">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
        </svg>
        API Docs (Swagger)
      </a>
      <a href="/openapi.json" target="_blank"
         class="flex items-center gap-1 text-indigo-600 hover:underline">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
        </svg>
        OpenAPI JSON
      </a>
    </div>
  </div>

</div>

<script>
function settingsSection() {
  return {
    cfg: { has_api_key: false, model: null, base_url: null },
    async load() {
      try {
        const res = await fetch('/api/config');
        if (res.ok) this.cfg = await res.json();
      } catch (_) {
        // API not yet wired
      }
    }
  }
}
</script>
