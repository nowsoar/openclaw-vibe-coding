<!-- Harness partial — loaded by HTMX into #content -->
<div x-data="harnessSection()" x-init="load()" class="max-w-4xl">

  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Harness</h1>
    <span class="text-sm text-gray-500" x-text="items.length + ' harness(es) registered'"></span>
  </div>

  <!-- Loading state -->
  <div x-show="loading" class="flex items-center gap-2 text-gray-400 py-10">
    <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
    </svg>
    Loading harnesses…
  </div>

  <!-- Empty state -->
  <div x-show="!loading && items.length === 0"
       class="text-center py-16 text-gray-400">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto mb-3 opacity-40" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
    </svg>
    <p class="font-medium">No harnesses found</p>
    <p class="text-sm mt-1">Run <code class="bg-gray-100 px-1 rounded">harnesskit harness create</code> to add one.</p>
  </div>

  <!-- Harness list -->
  <div x-show="!loading && items.length > 0" class="space-y-3">
    <template x-for="h in items" :key="h.name">
      <div class="bg-white rounded-lg border border-gray-200 p-4 hover:shadow-md transition-shadow flex items-center justify-between">
        <div>
          <h3 class="font-semibold text-gray-900" x-text="h.name"></h3>
          <p class="text-sm text-gray-500 mt-1" x-text="h.description || 'No description'"></p>
        </div>
        <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full font-mono"
              x-text="h.version || 'n/a'"></span>
      </div>
    </template>
  </div>

</div>
