<!-- Eval Dashboard partial — Phase 8.5 -->
<div x-data="evalSection()" x-init="load()" class="max-w-5xl">

  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Eval Dashboard</h1>
    <button @click="loadAll()" class="text-sm text-indigo-600 hover:underline">↻ Refresh</button>
  </div>

  <!-- Stats row -->
  <div class="grid gap-4 sm:grid-cols-3 mb-6">
    <div class="bg-white rounded-lg border border-gray-200 p-4 text-center">
      <div id="eval-stats-suites" class="text-3xl font-bold text-indigo-600"
           x-text="loading ? '…' : suites.length">—</div>
      <div class="text-sm text-gray-500 mt-1">Test Suites</div>
    </div>
    <div class="bg-white rounded-lg border border-gray-200 p-4 text-center">
      <div id="eval-stats-passed" class="text-3xl font-bold text-green-600"
           x-text="loading ? '…' : totalPassed">—</div>
      <div class="text-sm text-gray-500 mt-1">Passed Cases</div>
    </div>
    <div class="bg-white rounded-lg border border-gray-200 p-4 text-center">
      <div id="eval-stats-failed" class="text-3xl font-bold text-red-500"
           x-text="loading ? '…' : totalFailed">—</div>
      <div class="text-sm text-gray-500 mt-1">Failed Cases</div>
    </div>
  </div>

  <!-- Main content: two-column layout -->
  <div class="grid gap-6 lg:grid-cols-2 mb-6">

    <!-- Left: Suite list -->
    <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
        <h2 class="font-semibold text-gray-800 text-sm">Test Suites</h2>
        <input id="eval-suite-search"
               x-model="suiteSearch"
               type="text"
               placeholder="Filter…"
               class="text-xs border border-gray-200 rounded px-2 py-1 w-28 focus:outline-none focus:ring-1 focus:ring-indigo-400">
      </div>

      <!-- Empty state for suites -->
      <div id="eval-suite-empty"
           x-show="!loading && filteredSuites.length === 0"
           class="p-6 text-center text-gray-400 text-sm">
        No test suites found. Create one with<br>
        <code class="bg-gray-100 px-1 rounded text-xs">harnesskit eval suite-add</code>
      </div>

      <!-- Suite list -->
      <ul id="eval-suite-list" class="divide-y divide-gray-50">
        <template x-for="suite in filteredSuites" :key="suite.name">
          <li class="px-4 py-3 hover:bg-gray-50 transition-colors">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0 flex-1">
                <div class="font-medium text-gray-900 text-sm truncate" x-text="suite.name"></div>
                <div class="text-xs text-gray-500 mt-0.5 truncate" x-text="suite.description"></div>
                <div class="flex gap-3 mt-1">
                  <span class="text-xs text-gray-400">
                    <span class="font-medium text-gray-600" x-text="suite.case_count"></span> cases
                  </span>
                  <span class="text-xs text-gray-400">
                    <span class="font-medium text-gray-600" x-text="suite.assertion_count"></span> assertions
                  </span>
                </div>
              </div>
              <button
                @click="openRunPanel(suite.name)"
                class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-2 py-1 rounded shrink-0 transition-colors"
                x-text="runSuiteName === suite.name && runPanelOpen ? 'Close' : 'Run'">
              </button>
            </div>

            <!-- Inline run panel -->
            <div x-show="runSuiteName === suite.name && runPanelOpen"
                 class="mt-3 pt-3 border-t border-gray-100">
              <div class="flex gap-2 items-center">
                <input id="eval-run-target"
                       x-model="runTarget"
                       type="text"
                       placeholder="Skill name (e.g. my-skill)"
                       class="flex-1 text-xs border border-gray-200 rounded px-2 py-1.5 focus:outline-none focus:ring-1 focus:ring-indigo-400">
                <button id="eval-run-btn"
                        @click="runSuite(suite.name)"
                        :disabled="running || !runTarget.trim()"
                        class="text-xs bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white px-3 py-1.5 rounded transition-colors">
                  <span x-show="!running">▶ Run</span>
                  <span x-show="running">…</span>
                </button>
              </div>
              <div id="eval-run-error"
                   x-show="runError"
                   class="mt-2 text-xs text-red-600 bg-red-50 rounded px-2 py-1"
                   x-text="runError"></div>
              <div x-show="runSuccess"
                   class="mt-2 text-xs text-green-700 bg-green-50 rounded px-2 py-1"
                   x-text="runSuccess"></div>
            </div>
          </li>
        </template>
      </ul>
    </div>

    <!-- Right: Recent results table -->
    <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
      <div class="px-4 py-3 border-b border-gray-100">
        <h2 class="font-semibold text-gray-800 text-sm">Recent Runs</h2>
      </div>

      <!-- Empty state for results -->
      <div id="eval-results-empty"
           x-show="!loading && results.length === 0"
           class="p-6 text-center text-gray-400 text-sm">
        No eval results yet.
      </div>

      <div class="overflow-x-auto">
        <table id="eval-results-table" class="w-full text-xs">
          <thead x-show="results.length > 0">
            <tr class="bg-gray-50 text-gray-500 uppercase tracking-wide text-left">
              <th class="px-3 py-2 font-medium">Time</th>
              <th class="px-3 py-2 font-medium">Target</th>
              <th class="px-3 py-2 font-medium">Suite</th>
              <th class="px-3 py-2 font-medium text-center">Pass</th>
              <th class="px-3 py-2 font-medium text-center">Rate</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-50">
            <template x-for="(r, idx) in results" :key="idx">
              <tr class="hover:bg-gray-50 transition-colors">
                <td class="px-3 py-2 text-gray-500 whitespace-nowrap"
                    x-text="formatTime(r.timestamp)"></td>
                <td class="px-3 py-2 text-gray-900 font-medium max-w-[8rem] truncate"
                    :title="r.target" x-text="r.target"></td>
                <td class="px-3 py-2 text-gray-600 max-w-[7rem] truncate"
                    :title="r.suite" x-text="r.suite"></td>
                <td class="px-3 py-2 text-center">
                  <span :class="passRateColor(r.summary)"
                        class="font-semibold"
                        x-text="(r.summary.passed ?? 0) + '/' + (r.summary.total ?? 0)"></span>
                </td>
                <td class="px-3 py-2 text-center">
                  <span :class="passRateColor(r.summary)"
                        class="font-semibold"
                        x-text="passRatePct(r.summary)"></span>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Trend chart -->
  <div id="eval-trend-chart" class="bg-white rounded-lg border border-gray-200 p-4">
    <div class="flex items-center justify-between mb-3">
      <h2 class="font-semibold text-gray-800 text-sm">Pass-Rate Trend</h2>
      <span class="text-xs text-gray-400">last <span x-text="trend.length"></span> runs</span>
    </div>

    <!-- Empty state -->
    <div x-show="!loading && trend.length === 0"
         class="text-center text-gray-400 text-sm py-4">
      No trend data yet.
    </div>

    <!-- SVG sparkline -->
    <div x-show="trend.length > 0" class="overflow-x-auto">
      <svg :width="Math.max(400, trend.length * 28)" height="80"
           class="block text-indigo-500" x-ref="trendSvg">
        <!-- Grid lines -->
        <line x1="0" y1="10" :x2="Math.max(400, trend.length * 28)" y2="10"
              stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4"/>
        <line x1="0" y1="40" :x2="Math.max(400, trend.length * 28)" y2="40"
              stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4"/>
        <line x1="0" y1="70" :x2="Math.max(400, trend.length * 28)" y2="70"
              stroke="#e5e7eb" stroke-width="1"/>
        <!-- Labels -->
        <text x="2" y="9" font-size="7" fill="#9ca3af">100%</text>
        <text x="2" y="39" font-size="7" fill="#9ca3af">50%</text>
        <text x="2" y="69" font-size="7" fill="#9ca3af">0%</text>
        <!-- Polyline -->
        <polyline
          :points="trendPoints"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linejoin="round"
          stroke-linecap="round"/>
        <!-- Dots -->
        <template x-for="(pt, i) in trendDots" :key="i">
          <circle :cx="pt.x" :cy="pt.y" r="3"
                  :fill="pt.rate >= 1 ? '#22c55e' : pt.rate >= 0.7 ? '#eab308' : '#ef4444'"
                  :title="pt.label"/>
        </template>
      </svg>
    </div>

    <!-- Legend -->
    <div x-show="trend.length > 0" class="flex gap-4 mt-2 text-xs text-gray-500">
      <span class="flex items-center gap-1">
        <span class="w-2 h-2 rounded-full bg-green-500 inline-block"></span>100%
      </span>
      <span class="flex items-center gap-1">
        <span class="w-2 h-2 rounded-full bg-yellow-500 inline-block"></span>≥70%
      </span>
      <span class="flex items-center gap-1">
        <span class="w-2 h-2 rounded-full bg-red-500 inline-block"></span>&lt;70%
      </span>
    </div>
  </div>

</div>
