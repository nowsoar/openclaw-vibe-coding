<!-- Logs partial — loaded by HTMX into #content -->
<div x-data="logsSection()" x-init="load()" class="max-w-4xl">

  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Call Logs</h1>
    <button @click="load()"
            class="text-sm px-3 py-1.5 rounded border border-gray-300 text-gray-600 hover:bg-gray-50 flex items-center gap-1">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
      Refresh
    </button>
  </div>

  <!-- Loading -->
  <div x-show="loading" class="flex items-center gap-2 text-gray-400 py-10">
    <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
    </svg>
    Loading logs…
  </div>

  <!-- Empty state -->
  <div x-show="!loading && entries.length === 0"
       class="bg-white rounded-lg border border-gray-200 p-8 text-center text-gray-400">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto mb-3 opacity-40" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
    </svg>
    <p class="font-medium">No logs yet</p>
    <p class="text-sm mt-1">Logs appear here after running a skill.</p>
  </div>

  <!-- Log table -->
  <div x-show="!loading && entries.length > 0"
       class="bg-white rounded-lg border border-gray-200 overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider">
        <tr>
          <th class="px-4 py-3 text-left">Time</th>
          <th class="px-4 py-3 text-left">Skill</th>
          <th class="px-4 py-3 text-left">Model</th>
          <th class="px-4 py-3 text-right">Tokens</th>
          <th class="px-4 py-3 text-right">Duration</th>
          <th class="px-4 py-3 text-center">Status</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-100">
        <template x-for="(e, i) in entries" :key="i">
          <tr class="hover:bg-gray-50">
            <td class="px-4 py-2 text-gray-500 font-mono text-xs" x-text="formatTime(e.timestamp)"></td>
            <td class="px-4 py-2 font-medium" x-text="e.skill || '—'"></td>
            <td class="px-4 py-2 text-gray-500" x-text="e.model || '—'"></td>
            <td class="px-4 py-2 text-right text-gray-500"
                x-text="((e.input_tokens || 0) + (e.output_tokens || 0)).toLocaleString()"></td>
            <td class="px-4 py-2 text-right text-gray-500"
                x-text="e.duration ? e.duration.toFixed(2) + 's' : '—'"></td>
            <td class="px-4 py-2 text-center">
              <span :class="e.status === 'success'
                ? 'bg-green-100 text-green-700'
                : 'bg-red-100 text-red-700'"
                class="text-xs px-2 py-0.5 rounded-full font-medium"
                x-text="e.status || 'unknown'"></span>
            </td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>

</div>
