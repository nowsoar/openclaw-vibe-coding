[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-kit"
version = "0.1.0"
description = "Local AI Harness engineering toolkit — manage AI Agent runtimes like code"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "HarnessKit Contributors"},
]
keywords = [
    "ai",
    "agent",
    "harness",
    "llm",
    "prompt",
    "cli",
    "devtools",
    "mlops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0.0",
    "jinja2>=3.0.0",
    "openai>=1.0.0",
    "jsonpath-ng>=1.6.0",
    "textual>=0.40.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/openclaw/harnesskit"
Repository = "https://github.com/openclaw/harnesskit"
"Bug Tracker" = "https://github.com/openclaw/harnesskit/issues"
Changelog = "https://github.com/openclaw/harnesskit/blob/main/ROADMAP.md"

[project.scripts]
harnesskit = "harness_kit.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.24.0",
]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
mcp = [
    "mcp>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["harness_kit"]
