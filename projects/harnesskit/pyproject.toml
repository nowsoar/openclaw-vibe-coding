[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-kit"
version = "0.1.0"
description = "Local AI Harness engineering toolkit — manage AI Agent runtimes like code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0.0",
    "jinja2>=3.0.0",
    "openai>=1.0.0",
]

[project.scripts]
harnesskit = "harness_kit.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["harness_kit"]
