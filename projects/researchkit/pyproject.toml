[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "researchkit"
version = "0.1.0"
description = "AI-powered research automation toolkit with configurable data sources"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["ai", "research", "automation", "llm", "data-collection", "web-scraping"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "openai>=1.0.0",
    "feedparser>=6.0.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "python-dateutil>=2.8.0",
    "click>=8.0.0",
    # Phase 2
    "markdown>=3.5",
    # Phase 3
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "sqlmodel>=0.0.18",
    "aiosqlite>=0.20",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    # Phase 5
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-mock>=3.12",
]
playwright = ["playwright>=1.42"]
pdf = ["weasyprint>=60.0", "reportlab>=4.0"]
feishu = ["requests>=2.28.0"]

[project.scripts]
researchkit = "researchkit.cli:app"

[project.urls]
Homepage = "https://github.com/nowsoar/openclaw-vibe-coding/tree/main/projects/researchkit"
Repository = "https://github.com/nowsoar/openclaw-vibe-coding"

[tool.pytest.ini_options]
testpaths = ["tests"]
